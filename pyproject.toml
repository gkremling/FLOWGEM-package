[project]
name = "flowgem"
version = "0.1.0"
description = "Nonparametric generative sampling for MAR missing data via approximate Wasserstein gradient flows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Muhammad Haris Mumtaz" },
    { name = "Gitte Kremling", email = "gitte.kremling@uni-hamburg.de" },
]
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "tqdm>=4.68.4",
    "hyperimpute>=0.1.17"
]

[project.urls]
Homepage = "https://github.com/gkremling/FLOWGEM-package"
Repository = "https://github.com/gkremling/FLOWGEM-package"
Documentation = "https://flowgem.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
docs = [
    "myst-nb (>=1.4.0,<2.0.0)",
    "sphinx-autoapi (>=3.8.1,<4.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)"
]
